# AIVC Evaluation Profile: Evaluation Run (N=30)
# Optimized for quick validation, smoke tests, and N=30 benchmark iterations.

profile: "eval"

# Target reference models evaluated in pilot/eval run
model: "google/gemini-3.7-flash"
models:
  - "google/gemini-3.7-flash"
  - "meta/muse-glimmer"

# Execution limits per benchmark (N=30)
limits:
  swebench_cl: 30
  devbench: 30
  commit_chronicles: 30

limit: 30
reset_checkpoint: true
max_turns: 50
max_tokens: 4096
max_cost_per_instance_usd: 0.10

# Output paths
paths:
  checkpoints_dir: "eval/checkpoints/dry_run"
  metrics_dir: "eval/metrics/dry_run"
  plots_dir: "eval/plots/dry_run"
  scratch_dir: "eval/scratch/dry_run"
